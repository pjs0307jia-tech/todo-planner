<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffafd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TO-DO!">
<title>TO-DO!</title>
<link rel="icon" type="image/png" href="/todo-planner/todo-logo-final-180.png">
<link rel="shortcut icon" href="/todo-planner/todo-logo-final-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="/todo-planner/todo-logo-final-180.png">
<link rel="manifest" href="/todo-planner/manifest.webmanifest?v=70">
<link rel="stylesheet" href="style.css?v=27">
<link rel="stylesheet" href="edit-override.css?v=27">
<link rel="stylesheet" href="deadline-feature.css?v=27">
<link rel="stylesheet" href="size-override.css?v=27">
<link rel="stylesheet" href="day-manager.css?v=27">
<link rel="stylesheet" href="work-mode-fix.css?v=27">
<link rel="stylesheet" href="mobile-ui.css?v=29">
<link rel="stylesheet" href="mobile-fix.css?v=31">
<link rel="stylesheet" href="mobile-modal-v32.css?v=32">
<link rel="stylesheet" href="todo-status.css?v=83">
<style>
@media (min-width:801px){
  .side,.deadline-panel{display:flex;flex-direction:column;overflow:hidden}
  .side .todo-list,.deadline-panel .deadline-scroll{flex:1;min-height:0;overflow-y:auto}
  .side .todo-list{padding-right:4px;scrollbar-width:thin;scrollbar-color:#ead8df transparent}
  .side .todo-list::-webkit-scrollbar,.deadline-panel .deadline-scroll::-webkit-scrollbar{width:6px}
  .side .todo-list::-webkit-scrollbar-track,.deadline-panel .deadline-scroll::-webkit-scrollbar-track{background:transparent}
  .side .todo-list::-webkit-scrollbar-thumb,.deadline-panel .deadline-scroll::-webkit-scrollbar-thumb{background:#ead8df;border-radius:999px}
  body[data-mode="work"] .side .todo-list{scrollbar-color:#dbe7f4 transparent}
  body[data-mode="work"] .side .todo-list::-webkit-scrollbar-thumb{background:#dbe7f4}
  .side .side-note,.deadline-panel .deadline-foot{flex:none}
}
</style>
</head>
<body data-mode="job">
<main class="wrap">
  <header class="hero">
    <div class="hero-left">
      <h1>TO-DO!</h1>
      <div class="mode-switch" aria-label="플래너 모드">
        <button class="mode-btn on" data-mode="job">취준</button>
        <button class="mode-btn" data-mode="work">업무</button>
      </div>
    </div>
    <div class="hero-right">
      <button class="id-pill" id="idBtn"><span class="sync-dot local" id="syncDot"></span><span id="idText">ID</span></button>
      <button class="today-btn" id="todayBtn">오늘로</button>
    </div>
  </header>

  <section class="layout">
    <aside class="card deadline-panel" id="deadlinePanel">
      <div class="deadline-head">
        <div><strong>원서 마감</strong><span>D-day · 마감시간 · 노션</span></div>
        <button class="deadline-add-toggle" id="deadlineAddToggle" type="button">+ 원서</button>
      </div>
      <form class="deadline-form" id="deadlineForm" hidden>
        <input class="deadline-input" id="deadlineCompany" maxlength="36" autocomplete="off" placeholder="기업명 / 공고명" required>
        <div class="deadline-time-row">
          <input class="deadline-input" id="deadlineDate" type="date" required>
          <input class="deadline-input" id="deadlineTime" type="time" value="23:59" required>
        </div>
        <input class="deadline-input" id="deadlineUrl" maxlength="300" autocomplete="off" placeholder="노션 URL (선택)">
        <div class="deadline-form-actions">
          <button class="deadline-cancel" id="deadlineCancelBtn" type="button">취소</button>
          <button class="deadline-save" id="deadlineSaveBtn" type="submit">추가</button>
        </div>
      </form>
      <div class="deadline-scroll"><div class="deadline-list" id="deadlineList"></div></div>
      <div class="deadline-foot">마감이 가까운 순서로 자동 정렬돼요.<br>↗가 있는 원서는 노션으로 바로 이동할 수 있어요.</div>
    </aside>

    <div class="card calendar-card">
      <div class="cal-head">
        <div class="month-wrap"><strong class="month" id="monthTitle"></strong><span class="month-stats" id="monthStats"></span></div>
        <div class="nav"><button class="icon-btn" id="prev" aria-label="이전 달">←</button><button class="icon-btn" id="next" aria-label="다음 달">→</button></div>
      </div>
      <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="grid" id="grid"></div>

      <section class="selected-deadlines" id="selectedDeadlines" hidden></section>

      <section class="events-panel">
        <div class="events-title"><strong>캘린더 일정</strong><span>취준 · 업무 모드에서 함께 보여요</span></div>
        <form class="event-form" id="eventForm">
          <div class="palette" id="palette"></div>
          <input class="event-input" id="eventInput" maxlength="42" autocomplete="off" placeholder="예: 언니 생일 / 14:00 면접">
          <button class="add-small">일정 추가</button>
        </form>
        <div class="event-list" id="eventList"></div>
      </section>
    </div>

    <aside class="card side">
      <div class="side-label" id="modeLabel">취준 TO-DO</div>
      <div class="side-date" id="dateTitle"></div>
      <div class="holiday-name" id="holidayName"></div>
      <div class="progress">
        <div class="ring" id="ring"><span id="pct">0%</span></div>
        <div class="progress-copy"><strong id="pTitle">아직 할 일이 없어요</strong><span id="pSub">하나씩 적어두면 돼요.</span></div>
      </div>
      <form class="todo-form" id="todoForm"><input class="todo-input" id="todoInput" maxlength="80" autocomplete="off" placeholder="예: G마켓 자소서 2번 수정"><button class="todo-add">추가</button></form>
      <div class="mood-box">
        <div class="mood-top"><strong id="moodTitle">오늘 만족도</strong><span id="moodCaption">가볍게 기록해요</span></div>
        <div class="rating" id="rating"></div>
      </div>
      <div class="todo-list" id="todoList"></div>
      <div class="side-note" id="storageNote">ID별로 이 브라우저에 저장돼요.</div>
    </aside>
  </section>
</main>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>내 TO-DO 열기</h2>
    <p>식별번호로 내 플래너를 구분해요.<br>지수는 <strong>0307</strong>을 입력하면 돼요.</p>
    <form class="code-form" id="codeForm"><input class="code-input" id="codeInput" inputmode="numeric" autocomplete="off" maxlength="12" value="0307"><button class="code-go">열기</button></form>
    <div class="login-foot">※ 4자리 식별번호는 강한 비밀번호가 아니라 개인 플래너 구분용이에요.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js?v=83"></script>
<script src="calendar-doubletap-v3.js?v=1"></script>
<script src="splash-v2.js?v=78"></script>
<script src="palette-override.js?v=72"></script>
<script src="edit-override.js?v=27"></script>
<script src="deadline-feature.js?v=80"></script>
<script src="day-manager.js?v=27"></script>
<script src="desktop-interactions.js?v=92"></script>
<script src="todo-reorder.js?v=1"></script>
<script>
(function(){
  const calendar=document.querySelector('.calendar-card');
  const side=document.querySelector('.side');
  const deadline=document.querySelector('.deadline-panel');
  if(!calendar)return;

  const syncPanelHeights=()=>{
    if(window.innerWidth<=800){
      if(side){side.style.height='';side.style.maxHeight=''}
      if(deadline){deadline.style.height='';deadline.style.minHeight='';deadline.style.maxHeight=''}
      return;
    }
    requestAnimationFrame(()=>{
      const h=calendar.offsetHeight+'px';
      if(side){side.style.height=h;side.style.maxHeight=h}
      if(deadline){deadline.style.height=h;deadline.style.minHeight=h;deadline.style.maxHeight=h}
    });
  };

  syncPanelHeights();
  window.addEventListener('load',syncPanelHeights);
  window.addEventListener('resize',syncPanelHeights);
  document.querySelectorAll('.mode-btn,#prev,#next,#todayBtn').forEach(btn=>btn.addEventListener('click',()=>setTimeout(syncPanelHeights,20)));
  if('ResizeObserver' in window)new ResizeObserver(syncPanelHeights).observe(calendar);
})();
</script>
</body>
</html>
