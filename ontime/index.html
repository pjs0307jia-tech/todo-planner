function btn(cls,text,attrs=''){return `<button class="${cls}" ${attrs}>${text}</button>`}function header(){return `<aside class="side"><div class="logo"><b class="logo-mark">◷</b><span class="brand">ontime<span style="color:#386add">.</span></span></div><div class="nav-label">STUDY ROOM</div><button class="nav ${screen==='home'?'active':''}" data-action="home">⌂ <span>모의고사 보관함</span></button><button class="nav" data-action="backup">⇩ <span>전체 기록 백업</span></button><button class="nav" data-action="restore">⇧ <span>백업 복원</span></button><div class="side-bottom">☁️ <b style="color:#5c6b80">자동 저장</b><br>이 브라우저에 실시간으로 기록해요.<br>중요한 기록은 백업도 해주세요.</div></aside>`}function top(){const labels={home:'내 모의고사',folder:f()?.name||'모의고사',exam:(f()?.name||'')+' / '+(a()?.name||''),results:'영역별 성적표'};return `<header class="topbar"><div class="crumb">STUDY <span style="margin:0 10px;color:#cad1db">/</span> <strong>${escapeHTML(labels[screen])}</strong></div><div class="top-actions"><span class="pill" style="font-size:11px">● 로컬 자동 저장</span>${btn('ghost','전체 백업 ↧','data-action="backup"')}</div></header>`}function home(){let completed=folders.reduce((n,x)=>n+x.areas.filter(y=>y.session?.completed).length,0), total=folders.reduce((n,x)=>n+x.areas.reduce((s,y)=>s+y.questions.length,0),0);return `<div class="view"><div class="hero"><div><div class="eyebrow">MY PRACTICE SPACE</div><h1 class="h1">나만의 인적성 연습실 ✨</h1><p class="sub">문제를 모으고, 실전처럼 풀고, 빠르게 복습하세요.</p></div>${btn('primary','＋ 새 모의고사','data-action="new-folder"')}</div><div class="stats"><div class="stat"><div class="stat-title">내 모의고사 폴더</div><div class="stat-val">${folders.length}<span class="muted" style="font-size:15px"> 개</span></div><div class="stat-hint">시험별 기록을 한곳에</div></div><div class="stat"><div class="stat-title">모아둔 문제</div><div class="stat-val">${total}<span class="muted" style="font-size:15px"> 문제</span></div><div class="stat-hint">이미지와 선택지 모두 저장</div></div><div class="stat"><div class="stat-title">완료한 영역</div><div class="stat-val">${completed}<span class="muted" style="font-size:15px"> 회</span></div><div class="stat-hint">제출한 결과는 언제든 복습</div></div></div><div class="section-head"><h2>내 모의고사 <span class="muted" style="font-weight:400">${folders.length}</span></h2></div>${folders.length?`<div class="cards">${folders.map(x=>`<div class="folder" data-action="open-folder" data-id="${x.id}" role="button" tabindex="0"><div class="folder-icon">📁</div><h3>${escapeHTML(x.name)}</h3><small>${escapeHTML(x.desc||'영역별 모의고사')}</small><div class="folder-foot"><span>${x.areas.length}개 영역 · ${x.areas.reduce((n,a)=>n+a.questions.length,0)}문제</span><span>${new Date(x.updated).toLocaleDateString('ko-KR')}</span></div></div>`).join('')}</div>`:`<div class="empty"><span class="empty-icon">📂</span><b>아직 모의고사가 없어요</b><p>‘새 모의고사’를 눌러 SKCT 1회 모의고사처럼 폴더를 만들어 보세요.</p>${btn('primary','첫 모의고사 만들기','data-action="new-folder"')}</div>`}<div class="notice">💡 문제 사진을 올리면 텍스트 인식을 시도하며, AI 서버 연결 시 문제별 자동 분리와 해설까지 이용할 수 있습니다. 원본 사진은 함께 보관해요. 기기 변경이나 브라우저 데이터 삭제에 대비해 <b>전체 백업</b>을 정기적으로 이용하세요.</div></div>`}
function folder(){const folder=f();if(!folder)return go('home');let total=folder.areas.reduce((n,a)=>n+a.questions.length,0);return `<div class="view"><button class="back" data-action="home">← 모의고사 보관함</button><div class="hero"><div><div class="eyebrow">PRACTICE FOLDER</div><h1 class="h1">📁 ${escapeHTML(folder.name)}</h1><p class="sub">${folder.areas.length}개 영역 · ${total}문제 · 1영역 기본 15분</p></div><div class="btn-set">${btn('ghost','이름 변경','data-action="rename-folder"')}${btn('ghost danger','폴더 삭제','data-action="delete-folder"')}</div></div><div class="section-head"><h2>영역별 문제집</h2>${btn('primary','＋ 영역 추가','data-action="new-area"')}</div><div class="area-list">${folder.areas.map((ar,i)=>`<div class="area-row"><div class="area-mark">${icons[i%icons.length]}</div><div class="area-info"><b>${escapeHTML(ar.name)}</b><p>${ar.questions.length}문제 · ${ar.session?.completed?'시험 완료':ar.session?.running?'진행 중':'미응시'} ${ar.session?.completed?'· 마지막 '+ar.session.lastQuestion+'번':''}</p></div><div class="btn-set">${btn('ghost','📷 문제 등록',`data-action="upload-area" data-id="${ar.id}"`)}${ar.questions.length?btn('soft',ar.session?.completed?'결과 보기 →':ar.session?.running?'계속 풀기 →':'실전 시작 →',`data-action="start-area" data-id="${ar.id}"`):''}${btn('icon-btn','✕',`title="영역 삭제" data-action="delete-area" data-id="${ar.id}"`)}</div></div>`).join('')}</div>${folder.areas.length?'':`<div class="empty">먼저 영역을 추가해 주세요. 각 영역마다 타이머와 채점 기록이 따로 저장돼요.</div>`}<div class="notice">📝 영역 하나당 15분으로 시작하며, 5분 또는 15분씩 연장할 수 있어요. 시험 기록을 초기화해도 등록한 문제는 사라지지 않습니다.</div></div>`}
function exam(){let ar=a();if(!ar)return go('folder');if(!ar.questions.length)return go('folder');qIndex=Math.min(qIndex,ar.questions.length-1);let qu=q(),left=timeLeft(ar),answered=ar.questions.filter(z=>z.answer!==''&&z.answer!=null).length;return `<div class="view" style="max-width:1550px"><button class="back" data-action="go-folder">← ${escapeHTML(f().name)} / ${escapeHTML(ar.name)}</button><div class="test-top"><div><div class="eyebrow">EXAM MODE · ${escapeHTML(ar.name)}</div><h1 class="h1" style="font-size:23px;margin:0">실전 연습 <span class="muted" style="font-size:14px;font-weight:500">${qIndex+1} / ${ar.questions.length}문제</span></h1></div><div class="timer"><div><div class="timer-label">남은 시간</div><div id="timer-now" class="time-number ${left<61?'urgent':''}">${fmtTime(left)}</div></div>${btn('ghost','＋ 5분', 'data-action="extend-5"')}${btn('ghost','＋ 15분','data-action="extend-15"')}${btn('primary','제출하기','data-action="finish"')}</div></div><div class="test-layout"><section class="paper"><div class="paper-head"><span class="q-badge">QUESTION ${String(qIndex+1).padStart(2,'0')}</span><div class="btn-set">${btn('ghost',qu.flag?'★ 체크 해제':'☆ 다시 볼 문제','data-action="flag"')}${btn('ghost','문제 수정','data-action="edit-q"')}${qu.image?btn('ghost',rawVisible?'정리된 문제':'원본 사진','data-action="toggle-raw"'):''}</div></div><div class="paper-body">${rawVisible&&qu.image?`<img class="raw-image raw-only" src="${qu.image}" alt="문제 원본 사진"><div class="field"><label>답안 (1~5)</label><input id="free-answer" value="${escapeHTML(qu.answer||'')}" placeholder="답안 입력"></div>`:`${qu.text?`<div class="q-text">${escapeHTML(qu.text)}</div>`:'<div class="muted" style="margin-bottom:15px">AI로 인식한 텍스트가 없어요. 아래 원본 이미지로 풀어 주세요.</div>'}${qu.choices?.length?`<div class="choices">${qu.choices.map((choice,i)=>`<button class="choice ${qu.answer===String(i+1)?'on':''}" data-action="answer" data-value="${i+1}"><span class="choice-num">${i+1}</span><span>${escapeHTML(choice)}</span></button>`).join('')}</div>`:`<div class="field"><label>답안 입력 (숫자 또는 선택지)</label><input id="free-answer" value="${escapeHTML(qu.answer||'')}" placeholder="답안을 입력하세요" autocomplete="off"></div>`}${(!qu.text&&qu.image||qu.hasDiagram&&qu.image)?`<img class="raw-image" src="${qu.image}" alt="문제 그림 또는 표 원본">`:''}`}<div class="muted tiny" style="margin-top:20px">✎ 답안은 자동 저장됩니다. 인식이 잘못된 경우 ‘문제 수정’을 눌러 고칠 수 있어요.</div></div><div class="paper-foot">${btn('ghost','← 이전 문제','data-action="prev" '+(qIndex===0?'disabled':''))}<span class="muted tiny">${answered} / ${ar.questions.length} 답안 작성</span>${btn('primary',qIndex===ar.questions.length-1?'마지막 문제 ✓':'다음 문제 →','data-action="next"')}</div></section><div class="right"><section class="panel"><div class="panel-title"><span>문제 바로가기</span><span class="muted tiny">${answered}/${ar.questions.length}</span></div><div class="bar" style="margin-bottom:16px"><div style="width:${answered/ar.questions.length*100}%"></div></div><div class="qlinks">${ar.questions.map((z,i)=>`<button data-action="jump" data-index="${i}" title="${i+1}번${z.flag?' · 다시 볼 문제':''}" class="qnum ${qIndex===i?'current':''} ${z.answer?'answered':''} ${z.flag?'flagged':''}">${i+1}</button>`).join('')}</div><div class="muted tiny" style="margin-top:13px">🟢 답변 완료 · 🟠 다시 볼 문제</div></section><section class="panel"><div class="panel-title"><span>풀이 도구</span><span class="muted tiny">영역별 자동 저장</span></div><div class="tool-tabs">${[['memo','메모장'],['draw','그림판'],['calc','계산기']].map(([k,label])=>`<button class="tool-tab ${tool===k?'on':''}" data-action="tool" data-tool="${k}">${label}</button>`).join('')}</div>${tool==='memo'?`<textarea id="memo" class="memo" placeholder="계산 과정이나 풀이 메모를 자유롭게 입력하세요.">${escapeHTML(ar.memo||'')}</textarea>`:tool==='draw'?`<div class="draw-controls"><button class="color-dot ${pen==='#202937'&&!erase?'on':''}" data-action="pen" data-color="#202937" style="background:#202937" title="검정"></button><button class="color-dot ${pen==='#e2464f'&&!erase?'on':''}" data-action="pen" data-color="#e2464f" style="background:#e2464f" title="빨강"></button><button class="color-dot ${pen==='#2d67d6'&&!erase?'on':''}" data-action="pen" data-color="#2d67d6" style="background:#2d67d6" title="파랑"></button><button class="mini-btn ${erase?'on':''}" data-action="eraser">지우개</button><button class="mini-btn" data-action="clear-draw">전체 지우기</button></div><canvas class="drawing" id="drawing" width="540" height="432"></canvas>`:`<div class="calc-screen" id="calc-result">${escapeHTML(calc.display)}</div><div class="calc-grid">${['AC','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(k=>`<button class="${'÷×−+%'.includes(k)?'op':''} ${k==='='?'equal':''}" data-action="calc" data-value="${k}">${k}</button>`).join('')}</div>`}</section></div></div></div>`}
function statusOf(z){let key=z.official||z.aiAnswer;if(!key||z.answer===null||z.answer==='')return 'unknown';return String(key).trim().toLowerCase()===String(z.answer).trim().toLowerCase()?'right':'wrong'}function results(){const ar=a();if(!ar)return go('folder');let qs=ar.questions,correct=qs.filter(z=>statusOf(z)==='right').length,wrong=qs.filter(z=>statusOf(z)==='wrong').length,unknown=qs.length-correct-wrong,answered=qs.filter(z=>z.answer!==''&&z.answer!=null).length;let solving=qs.filter(z=>!z.explanation&&!z.official);return `<div class="view"><button class="back" data-action="go-folder">← ${escapeHTML(f().name)} / ${escapeHTML(ar.name)}</button><div class="eyebrow">EXAM REPORT</div><div class="hero"><div><h1 class="h1">${escapeHTML(ar.name)} 결과 📊</h1><p class="sub">${ar.session?.auto?'시간이 종료되어 자동 제출되었습니다.':'시험을 제출했습니다.'} ${ar.session?.lastQuestion||1}번 문제에서 종료 · 언제든 복습할 수 있어요.</p></div><div class="btn-set">${btn('ghost','＋ 5분 연장 풀이','data-action="resume-5"')}${btn('ghost','다시 풀기','data-action="restart"')}${btn('primary','폴더로 돌아가기','data-action="go-folder"')}</div></div><div class="result-grid"><div class="result-stat"><small>정답</small><b style="color:var(--green)">${correct}</b></div><div class="result-stat"><small>오답</small><b style="color:var(--red)">${wrong}</b></div><div class="result-stat"><small>미채점 / 미응답</small><b>${unknown}</b></div><div class="result-stat"><small>답안 작성</small><b>${answered}<span style="font-size:13px" class="muted"> / ${qs.length}</span></b></div></div><div class="detail-top"><h2 style="font-size:18px">문제별 30초 풀이</h2><div class="btn-set">${btn('ghost',showAnswerEditor?'정답 입력 닫기':'정답 직접 입력','data-action="answer-edit"')}${btn('soft',!backendAvailable?'💬 ChatGPT 해설 요청 복사':batchBusy?'AI 해설 생성 중…':'⚡ AI 빠른 해설 생성','data-action="solve-all" '+(batchBusy?'disabled':''))}</div></div><div class="notice" style="margin-top:9px">${!backendAvailable?'자동 AI 서버가 아직 연결되지 않아 공식 정답 입력으로 채점합니다. 빠른 해설은 요청 문구를 복사해 ChatGPT에서 확인할 수 있어요.':batchBusy?'<span class="spinner"></span>AI가 정답과 빠른 풀이를 분석 중이에요.':`채점 기준: <b>책의 공식 정답 우선</b>, 없으면 AI 추정 정답을 임시로 사용합니다. AI 정답과 해설은 반드시 책과 대조해 주세요.`} ${solving.length?'이미지나 도식 문제는 원본 사진을 참고해 분석합니다.':''}</div><div class="review-list">${qs.map((z,i)=>{let st=statusOf(z),key=z.official||z.aiAnswer;return `<div class="review"><div class="review-head"><b>${i+1}번</b><span class="status ${st}">${st==='right'?'정답':st==='wrong'?'오답':'미채점'}</span><span class="muted tiny">내 답: ${escapeHTML(z.answer||'미응답')} · 정답: ${escapeHTML(key||'확인 중')}</span>${z.flag?'<span class="status unknown">★ 체크</span>':''}</div><div class="review-text">${escapeHTML((z.text||'원본 사진 문제').slice(0,260))}${z.text?.length>260?'…':''}</div>${z.explanation?`<div class="explain"><strong>⚡ 30초 컷 풀이</strong>\n${escapeHTML(z.explanation)}${z.reason?'\n\n핵심 근거: '+escapeHTML(z.reason):''}${!z.official?'\n\n※ AI가 추론한 풀이입니다. 책의 정답표와 비교하세요.':''}</div>`:`${btn('ghost',z.solving?'<span class="spinner"></span>해설 생성 중':!backendAvailable?'💬 해설 요청 복사':'⚡ 빠른 해설 보기',`data-action="solve-one" data-index="${i}" ${z.solving?'disabled':''}`)}`}${z.image?btn('ghost','📷 원본 보기',`data-action="review-img" data-index="${i}" style="margin-left:8px"`):''}${showAnswerEditor?`<div class="key-input">공식 정답 <select data-key-index="${i}"><option value="">선택</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${z.official===String(n)?'selected':''}>${n}번</option>`).join('')}</select> <span>책의 정답을 입력하면 채점에 즉시 반영됩니다.</span></div>`:''}</div>`}).join('')}</div></div>`}
function dialog(){if(!modal)return '';let inner='';if(modal==='new-folder'||modal==='rename-folder'){inner=`<h2>${modal==='new-folder'?'새 모의고사 만들기':'폴더 이름 변경'}</h2><p>시험 회차별로 정리해 두면 나중에 기록을 확인하기 편해요.</p><div class="field"><label>모의고사 이름</label><input id="folder-name" maxlength="60" value="${modal==='rename-folder'?escapeHTML(f().name):''}" placeholder="예: SKCT 1회 모의고사" autofocus></div><div class="field"><label>메모 (선택)</label><input id="folder-desc" maxlength="100" value="${modal==='rename-folder'?escapeHTML(f().desc||''):''}" placeholder="예: 2026 하반기 대비"></div>`}if(modal==='new-area'){inner=`<h2>영역 추가</h2><p>영역별로 문제와 15분 타이머, 시험 기록이 구분됩니다.</p><div class="field"><label>영역 이름</label><select id="area-name">${AREAS.map(z=>`<option>${z}</option>`).join('')}</select></div><div class="field"><label>직접 입력 (선택)</label><input id="area-custom" placeholder="예: 실행역량"></div>`}if(modal==='finish'){inner=`<h2>시험을 제출할까요?</h2><p>현재 위치와 풀이 시간이 저장되고 결과 화면에서 해설과 채점을 확인할 수 있어요.</p>`}if(modal==='delete-folder'||modal==='delete-area'){inner=`<h2>정말 삭제할까요?</h2><p>삭제한 기록과 문제 사진은 복구할 수 없습니다. 중요한 자료는 미리 백업해 주세요.</p>`}if(modal==='restart'){inner=`<h2>처음부터 다시 풀까요?</h2><p>기존 답안과 메모, 그림 및 결과가 초기화됩니다. 문제 사진과 책의 공식 정답은 유지해요.</p>`}if(modal==='restore'){inner=`<h2>백업 복원</h2><p>이전에 내려받은 .json 파일을 선택하면 기존 폴더와 합쳐집니다. 같은 ID의 폴더는 백업 내용으로 대체됩니다.</p><input id="restore-file" type="file" accept=".json,application/json">`}if(modal==='edit-q'){let z=q();inner=`<h2>문제 인식 결과 수정</h2><p>원본 사진은 그대로 저장됩니다. 지문과 보기를 직접 고칠 수 있어요.</p><div class="field"><label>문제 / 지문</label><textarea id="edit-text" class="question-edit" style="min-height:150px">${escapeHTML(z.text||'')}</textarea></div>${[0,1,2,3,4].map(i=>`<div class="field" style="margin-top:8px"><label>${i+1}번 보기</label><input data-edit-choice="${i}" value="${escapeHTML(z.choices?.[i]||'')}"></div>`).join('')}`;}if(modal==='review-img'){inner=`<h2>문제 원본 사진</h2><div style="max-height:70vh;overflow:auto"><img src="${a()?.questions[Number(modalIndex)]?.image||''}" style="width:100%;object-fit:contain"></div>`}let confirmLabel=modal==='finish'?'제출하고 결과 보기':modal==='delete-folder'||modal==='delete-area'?'삭제':'저장';if(modal==='restart')confirmLabel='다시 풀기';if(modal==='restore')confirmLabel='백업 복원';return `<div class="modal-bg" data-action="close-modal"><div class="modal">${inner}<div class="modal-actions">${btn('ghost','취소','data-action="close-modal"')}${modal==='review-img'?'':btn(modal.startsWith('delete')?'ghost danger':'primary',confirmLabel,'data-action="confirm-modal"')}</div></div></div>`}
let modalIndex=0;function render(){if(!db)return;$('#root').innerHTML=`<div class="app">${header()}<main class="main">${top()}${({home,folder,exam,results}[screen]||home)()}</main></div>${dialog()}`;if(screen==='exam'){if(tool==='draw')loadDrawing();tick()}}function setModal(type){modal=type;render();$('#folder-name')?.focus()}function recordAnswer(v){if(!q())return;q().answer=String(v);scheduleSave(f());render()}function navQ(i){if(!a())return;qIndex=Math.max(0,Math.min(a().questions.length-1,i));rawVisible=false;render()}
function draw(){let cvs=$('#drawing');if(!cvs)return;let ctx=cvs.getContext('2d');function pos(e){const rect=cvs.getBoundingClientRect();return{x:(e.clientX-rect.left)*cvs.width/rect.width,y:(e.clientY-rect.top)*cvs.height/rect.height}}cvs.onpointerdown=e=>{drawing=true;cvs.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.strokeStyle=erase?'#fff':pen;ctx.lineWidth=erase?34:3.4;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()};cvs.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};cvs.onpointerup=cvs.onpointercancel=()=>{if(!drawing)return;drawing=false;a().drawing=cvs.toDataURL('image/png');scheduleSave(f())}}function loadDrawing(){const cvs=$('#drawing');if(!cvs)return;const ctx=cvs.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,cvs.width,cvs.height);if(a().drawing){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=a().drawing}draw()}
function calculate(k){if(k==='AC'){calc={display:'0',prev:null,op:null,reset:false}}else if(k==='⌫'){calc.display=calc.display.slice(0,-1)||'0'}else if(k==='±'){calc.display=String(-Number(calc.display))}else if(k==='%'){calc.display=String(Number(calc.display)/100)}else if('÷×−+'.includes(k)){calc.prev=Number(calc.display);calc.op=k;calc.reset=true}else if(k==='='){if(calc.op&&calc.prev!==null){let n=Number(calc.display),r=calc.op==='+'?calc.prev+n:calc.op==='−'?calc.prev-n:calc.op==='×'?calc.prev*n:n===0?NaN:calc.prev/n;calc.display=Number.isFinite(r)?String(Number(r.toPrecision(12))):'오류';calc.prev=null;calc.op=null;calc.reset=true}}else if(k==='.') {if(calc.reset){calc.display='0.';calc.reset=false}else if(!calc.display.includes('.'))calc.display+='.'}else if(/^[0-9]$/.test(k)){calc.display=calc.reset||calc.display==='0'?k:calc.display+k;calc.reset=false;if(calc.display.length>17)calc.display=calc.display.slice(0,17)}const node=$('#calc-result');if(node)node.textContent=calc.display}
function createArea(name){let ar={id:id(),name,questions:[],memo:'',drawing:'',session:{limit:900000,elapsed:0,running:false,completed:false}};f().areas.push(ar);areaId=ar.id;scheduleSave(f(),0);toast(name+' 영역을 만들었어요.');render()}
async function shrinkImage(file){let img=await createImageBitmap(file),long=Math.max(img.width,img.height),scale=Math.min(1,1750/long);let can=document.createElement('canvas');can.width=Math.round(img.width*scale);can.height=Math.round(img.height*scale);can.getContext('2d').drawImage(img,0,0,can.width,can.height);img.close();return can.toDataURL('image/jpeg',0.77)}async function aiCall(body){const ctrl=new AbortController;let timeout=setTimeout(()=>ctrl.abort(),110000);try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});let j=await r.json().catch(()=>({}));if(r.status===404||r.status===503){backendAvailable=false;}if(!r.ok)throw new Error(j.error||`AI 요청 실패 (${r.status})`);return j}finally{clearTimeout(timeout)}}
async function addPhotos(files){if(!files?.length||uploading)return;let folder=f(),ar=a();if(!folder||!ar)return;uploading=true;let ok=0;toast('사진을 불러오고 문제를 정리할게요.');for(const file of Array.from(files).slice(0,20)){if(!file.type.startsWith('image/'))continue;try{let data=await shrinkImage(file),parsed;try{if(!backendAvailable)throw new Error('이 배포에서는 자동 AI 서버가 연결되지 않았습니다.');parsed=await aiCall({mode:'extract',image:data})}catch(e){toast('텍스트 인식을 시도합니다. '+e.message);try{parsed=await offlineOCR(data)}catch(err){toast('텍스트 인식 실패: 원본 사진을 보관합니다.')}}let items=Array.isArray(parsed?.questions)&&parsed.questions.length?parsed.questions:[{text:'',choices:[],hasDiagram:true}];for(let item of items.slice(0,12)){let choices=Array.isArray(item.choices)?item.choices.map(z=>String(z).replace(/^[①②③④⑤1-5][.)\s]*/,'')) .filter(Boolean).slice(0,5):[];ar.questions.push({id:id(),text:String(item.text||'').slice(0,6000),choices,image:data,hasDiagram:!!item.hasDiagram,answer:'',official:'',aiAnswer:'',explanation:'',reason:'',flag:false}) ;ok++}await save(folder);toast(`${ok}문제 정리됨 · ${file.name}`)}catch(e){toast('사진 처리 실패: '+e.message)}}uploading=false;screen='folder';await save(folder);render();toast(`${ok}문제를 등록했어요. 영역의 실전 시작을 눌러 보세요.`)}
async function offlineOCR(img){if(!window.Tesseract){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('문자인식 도구 다운로드 실패'));document.head.appendChild(sc)})}toast('한국어 문자인식 중이에요. 수식과 표는 원본을 확인해 주세요.');let r=await window.Tesseract.recognize(img,'kor+eng');let text=String(r.data?.text||'').trim();if(!text)return{questions:[{text:'',choices:[],hasDiagram:true}]};let lines=text.split('\n').map(x=>x.trim()).filter(Boolean),ci=lines.findIndex(x=>/^(?:[①②③④⑤]|[1-5][.)]|\([1-5]\))/.test(x)),choices=ci>=0?lines.slice(ci).filter(x=>/^(?:[①②③④⑤]|[1-5][.)]|\([1-5]\))/.test(x)).map(x=>x.replace(/^(?:[①②③④⑤]|[1-5][.)]|\([1-5]\))\s*/,'' )).slice(0,5):[];return{questions:[{text:(ci>=0?lines.slice(0,ci):lines).join('\n'),choices,hasDiagram:true}]}}
function addManualQuestion(){const ar=a();ar.questions.push({id:id(),text:'문제 내용을 입력하거나 사진을 등록하세요.',choices:['','','','',''],image:'',hasDiagram:false,answer:'',official:'',aiAnswer:'',explanation:'',reason:'',flag:false});scheduleSave(f(),0);render()}
function exportBackup(){const data=JSON.stringify({format:'ontime-backup-v1',exportedAt:new Date().toISOString(),folders});const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`ontime-인적성-백업-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('전체 기록 백업 파일을 저장했어요.')}async function importBackup(file){if(!file)return toast('파일을 선택해 주세요.');try{let data=JSON.parse(await file.text());if(data.format!=='ontime-backup-v1'||!Array.isArray(data.folders))throw new Error('유효하지 않은 백업 파일');for(const item of data.folders){if(!item.id||!Array.isArray(item.areas))continue;await save(item);let i=folders.findIndex(x=>x.id===item.id);if(i<0)folders.push(item);else folders[i]=item}folders.sort((x,y)=>y.updated-x.updated);modal='';screen='home';render();toast('폴더 '+data.folders.length+'개의 백업을 복원했어요.')}catch(e){toast('백업 복원 실패: '+e.message)}}
async function generateExplanations(indices){if(!a()||batchBusy)return;const ar=a(),folder=f(),list=indices.filter(i=>ar.questions[i]&&!ar.questions[i].explanation);if(!list.length)return toast('이미 모든 문제의 해설이 있어요.');batchBusy=true;render();let succeeded=0;for(let offset=0;offset<list.length;offset+=4){let ids=list.slice(offset,offset+4);ids.forEach(i=>ar.questions[i].solving=true);if(screen==='results')render();try{let items=ids.map(i=>{let z=ar.questions[i];return{id:z.id,number:i+1,text:z.text,choices:z.choices,official:z.official||'',image:(!z.text||z.hasDiagram)?z.image:null}});let out=await aiCall({mode:'solve',items});for(let ans of out.answers||[]){let z=ar.questions.find(x=>x.id===ans.id);if(!z)continue;z.aiAnswer=String(ans.answer??'').replace(/[^0-9가-힣a-zA-Z.\-]/g,'').slice(0,45);z.explanation=String(ans.quick||'').slice(0,1100);z.reason=String(ans.reason||'').slice(0,600);succeeded++}await save(folder)}catch(e){toast('해설 일부를 생성하지 못했어요: '+e.message)}ids.forEach(i=>ar.questions[i].solving=false);if(screen==='results'&&a()?.id===ar.id)render()}batchBusy=false;if(screen==='results'&&a()?.id===ar.id)render();toast(`${succeeded}개 문제의 빠른 풀이를 정리했어요.`)}
async function copyReviewPrompt(index){let ar=a();const qs=(index===undefined?ar.questions:ar.questions.slice(index,index+1)).map((z,i)=>`${index===undefined?i+1:index+1}번. ${z.text}\n${z.choices?.map((x,j)=>`${j+1}) ${x}`).join('\n')||''}\n나의 답: ${z.answer||'미응답'} / 책 정답: ${z.official||'없음'}`).join('\n\n');const prompt='다음 인적성 문제를 정확히 풀어줘. 정답 및 근거를 검증하고, 실전에서 30초 이내로 푸는 가장 빠른 방법을 두괄식으로 설명해줘. 확신이 없으면 모른다고 해줘.\n\n'+qs;try{await navigator.clipboard.writeText(prompt);toast('문제와 30초 풀이 요청이 복사되었어요. ChatGPT에 붙여넣어 주세요.');window.open('https://chatgpt.com/','_blank','noopener')}catch(e){toast('복사 실패: 브라우저 복사 권한을 확인해 주세요.')}}
function autoReview(){if(!backendAvailable)return;const ar=a();if(!ar)return;let arr=ar.questions.map((z,i)=>!z.explanation?i:-1).filter(i=>i>=0);if(arr.length)generateExplanations(arr)}
let deletingAreaId=null;document.addEventListener('input',e=>{if(e.target.id==='memo'&&a()){a().memo=e.target.value;scheduleSave(f(),500)}if(e.target.id==='free-answer'&&q()){q().answer=e.target.value;scheduleSave(f(),250)}});document.addEventListener('change',e=>{if(e.target.id==='photo-input')addPhotos(e.target.files);if(e.target.hasAttribute('data-key-index')){const i=Number(e.target.dataset.keyIndex);a().questions[i].official=e.target.value;scheduleSave(f());render()}});document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;const key=b.dataset.id;if(act==='close-modal'){if(b.classList.contains('modal-bg')&&e.target!==b)return;modal='';render();return}if(act==='home'){go('home');return}if(act==='go-folder'){go('folder');return}if(act==='new-folder'||act==='rename-folder'||act==='new-area'||act==='finish'||act==='restart'||act==='restore'||act==='delete-folder'||act==='edit-q'){setModal(act);return}if(act==='delete-area'){deletingAreaId=key;setModal('delete-area');return}if(act==='confirm-modal'){const m=modal;modal='';if(m==='edit-q'){q().text=$('#edit-text')?.value||'';q().choices=[...document.querySelectorAll('[data-edit-choice]')].map(x=>x.value).filter(x=>x.trim());q().explanation='';q().aiAnswer='';scheduleSave(f(),0);render();return}if(m==='new-folder'){let name=$('#folder-name')?.value?.trim();if(!name)return toast('폴더 이름을 입력해 주세요.');let fo={id:id(),name,desc:$('#folder-desc')?.value?.trim()||'',updated:now(),areas:[]};folders.unshift(fo);folderId=fo.id;await save(fo);go('folder');return}if(m==='rename-folder'){f().name=$('#folder-name')?.value?.trim()||f().name;f().desc=$('#folder-desc')?.value?.trim()||'';scheduleSave(f(),0)}if(m==='new-area'){createArea($('#area-custom')?.value?.trim()||$('#area-name')?.value||'기타');return}if(m==='finish'){finishExam();return}if(m==='delete-folder'){const fid=folderId;folders=folders.filter(z=>z.id!==fid);await removeFolder(fid);folderId=null;go('home');return}if(m==='delete-area'){f().areas=f().areas.filter(x=>x.id!==deletingAreaId);scheduleSave(f(),0);areaId=null}if(m==='restart'){let ar=a();ar.questions.forEach(z=>{z.answer='';z.explanation='';z.aiAnswer='';z.reason='';z.flag=false});ar.memo='';ar.drawing='';ar.session={limit:900000,elapsed:0,running:false,completed:false};qIndex=0;runTimer();screen='exam';scheduleSave(f(),0)}if(m==='restore'){const file=$('#restore-file')?.files?.[0];if(file)await importBackup(file);else toast('백업 파일을 선택해 주세요.')}render();return}
if(act==='open-folder'){folderId=key;go('folder');return}if(act==='start-area'){areaId=key;qIndex=0;tool='memo';rawVisible=false;if(a().session?.completed){go('results');return}runTimer();go('exam');return}if(act==='upload-area'){areaId=key;document.getElementById('photo-input')?.remove();let input=document.createElement('input');input.type='file';input.id='photo-input';input.accept='image/*';input.multiple=true;input.hidden=true;document.body.appendChild(input);input.onchange=()=>addPhotos(input.files);input.click();return}
if(act==='prev'){navQ(qIndex-1);return}if(act==='next'){navQ(qIndex+1);return}if(act==='jump'){navQ(Number(b.dataset.index));return}if(act==='answer'){recordAnswer(b.dataset.value);return}if(act==='flag'){q().flag=!q().flag;scheduleSave(f());render();return}if(act==='toggle-raw'){rawVisible=!rawVisible;render();return}if(act==='tool'){tool=b.dataset.tool;render();return}if(act==='pen'){pen=b.dataset.color;erase=false;render();return}if(act==='eraser'){erase=!erase;render();return}if(act==='clear-draw'){if(confirm('그림판 내용을 전체 지울까요?')){a().drawing='';scheduleSave(f());loadDrawing()}return}if(act==='calc'){calculate(b.dataset.value);return}if(act.startsWith('extend-')){a().session.limit+=Number(act.split('-')[1])*60000;scheduleSave(f());tick();toast('연습 시간이 연장되었어요.');return}if(act==='resume-5'){a().session.completed=false;a().session.limit+=300000;a().session.running=false;runTimer();go('exam');return}if(act==='answer-edit'){showAnswerEditor=!showAnswerEditor;render();return}if(act==='solve-all'){if(!backendAvailable)return copyReviewPrompt();autoReview();return}if(act==='solve-one'){if(!backendAvailable)return copyReviewPrompt(Number(b.dataset.index));generateExplanations([Number(b.dataset.index)]);return}if(act==='restart'){setModal('restart');return}if(act==='review-img'){modalIndex=Number(b.dataset.index);setModal('review-img');return}if(act==='backup'){exportBackup();return}if(act==='restore'){setModal('restore');return}});
