function richText(value){

 const flush=()=>{if(!table.length)return;chunks.push('<div class="table-wrap"><table><tbody>'+table.map((row,i)=>'<tr>'+row.map(cell=>`<${i===0?'th':'td'}>${richInline(cell.trim())}</${i===0?'th':'td'}>`).join('')+'</tr>').join('')+'</tbody></table></div>');table=[]};
 for(const line of lines){const stripped=line.trim();const pipe=(stripped.startsWith('|')&&stripped.endsWith('|'))||(stripped.includes('|')&&stripped.split('|').length>=3);if(pipe){const cells=stripped.replace(/^\|/,'').replace(/\|$/,'').split('|');if(cells.every(c=>/^:?-{2,}:?$/.test(c.trim())))continue;table.push(cells);continue}flush();if(stripped)chunks.push(`<p>${richInline(line)}</p>`);else if(chunks.length&&chunks[chunks.length-1]!=='<div class="gap"></div>')chunks.push('<div class="gap"></div>')};flush();return `<div class="typed-paper">${chunks.join('')}</div>`;
