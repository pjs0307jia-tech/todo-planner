<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투두 기록 복구</title>
<style>body{font:16px/1.7 system-ui;background:#fff8fb;color:#4c454a;margin:0;padding:36px 20px}main{max-width:520px;margin:40px auto;background:white;padding:32px;border:1px solid #efdfE7;border-radius:24px}h1{font-size:25px}label{display:block;margin:20px 0}input{font:inherit;max-width:100%;box-sizing:border-box}input[type=text]{padding:8px;width:100%;border:1px solid #dbcdd3;border-radius:8px}button,a{font:inherit}button{background:#cf557f;color:white;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap}a{color:#b33464}</style>
<main><h1>투두와 하트 기록 복구</h1><p>백업 파일을 선택하면 기록을 이 브라우저에 복구합니다. 기존 기록도 별도로 보관합니다.</p><p>먼저 다른 투두리스트 탭은 닫아주세요. 복구 후에는 이 브라우저에서 사용할 수 있으며, 다른 기기와의 동기화는 잠시 멈춥니다.</p>
<label>내 ID<input id="code" type="text" inputmode="numeric" value="0307" pattern="[0-9]{4,12}"></label>
<label>백업 파일<input id="file" type="file" accept=".json,application/json"></label>
<button id="restore" disabled>기록 복구하기</button><p id="result" role="status"></p><a id="open" href="./?recovered=1" hidden>복구한 투두리스트 열기 →</a></main>
<script src="recovery-v1.js"></script><script>
const file=document.getElementById('file'),button=document.getElementById('restore'),result=document.getElementById('result');
file.onchange=()=>{button.disabled=!file.files.length};
button.onclick=async()=>{button.disabled=true;try{
 const code=document.getElementById('code').value.trim();if(!/^\d{4,12}$/.test(code))throw Error('사용하던 ID를 입력해주세요.');
 const raw=JSON.parse(await file.files[0].text()),backup=raw.state||raw;
 const key='todoPlanner_v3_'+code;let local={};try{local=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
 const next=mergePlannerRecovery(backup,local);
 const rescue={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('todoPlanner'))rescue[k]=localStorage.getItem(k)}
 localStorage.setItem('planner_manual_recovery_before_'+Date.now(),JSON.stringify(rescue));
 localStorage.setItem('todoPlanner_cloud_paused','1');
 localStorage.setItem(key,JSON.stringify(next));
 localStorage.setItem('todoPlanner_boot_rescue_'+code,JSON.stringify(next));
 sessionStorage.setItem('todoPlanner_preload_snapshot_'+code,JSON.stringify(next));
 localStorage.setItem('todoPlanner_activeCode',code);
 const count=Object.values(next.todos.job).reduce((n,a)=>n+a.length,0);
 result.textContent='복구 완료! 취준 투두 '+count+'개와 하트 기록을 불러왔어요. 아래 링크로 열어주세요.';document.getElementById('open').hidden=false;
}catch(e){result.textContent='복구하지 못했어요: '+e.message;button.disabled=false}};
</script></html>
