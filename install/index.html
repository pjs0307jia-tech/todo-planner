<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffafd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TO-DO!">
<title>TO-DO!</title>
<link rel="icon" type="image/svg+xml" href="/todo-planner/todo-home-icon-v66.svg">
<link rel="manifest" href="/todo-planner/manifest.webmanifest?v=66">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffafd;color:#4b4549;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;padding:24px}.box{width:min(100%,360px);background:#fff;border:1px solid #f0e5e9;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 18px 55px rgba(95,63,77,.09)}img{width:112px;height:112px;border-radius:24px;display:block;margin:0 auto 18px}h1{font-size:24px;margin:0 0 10px}p{font-size:14px;line-height:1.7;color:#8c8186;margin:0}.hint{margin-top:18px;padding:13px 14px;background:#fff3f7;border-radius:16px;color:#db7898;font-weight:700;font-size:13px}
</style>
</head>
<body>
<main class="box">
  <img src="/todo-planner/todo-home-icon-v66.svg" alt="TO-DO! 로고">
  <h1>TO-DO!</h1>
  <p>이 페이지를 <b>Safari 앱</b>에서 연 뒤<br>공유 → <b>홈 화면에 추가</b>를 선택해 주세요.</p>
  <div class="hint">위 로고가 보이면 같은 SVG 아이콘을 홈화면용으로 읽도록 설정돼 있어요 💗</div>
</main>
<script>
(function(){
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if(standalone) location.replace('/todo-planner/');
})();
</script>
</body>
</html>
